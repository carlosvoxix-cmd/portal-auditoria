<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Auditoria de Balancetes Confirp</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: barra superior com marca, abas de trabalho, conteúdo em tabelas densas tipo papel de trabalho de auditoria */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --fg:#17212e; --muted:#5b6778; --line:#dbe1e9;
  --brand:#0162e7; --brand-fg:#ffffff; --accent:#0162e7; --accent-soft:#e8f0fe; --head:#ffffff; --head-fg:#111111;
  --ok:#1d7a4f; --ok-soft:#e3f3ea; --warn:#a8650b; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe6e4; --info-soft:#e7eef7;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --fg:#e6ebf2; --muted:#9aa6b6; --line:#2a3443;
  --brand:#2f7bf0; --brand-fg:#ffffff; --accent:#5b9bf8; --accent-soft:#13233b; --head:#ffffff; --head-fg:#111111;
  --ok:#5fcf98; --ok-soft:#163327; --warn:#f0b75e; --warn-soft:#3a2c12; --bad:#f08a82; --bad-soft:#3d1c1a; --info-soft:#1b2a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --fg:#e6ebf2; --muted:#9aa6b6; --line:#2a3443;
  --brand:#2f7bf0; --brand-fg:#ffffff; --accent:#5b9bf8; --accent-soft:#13233b; --head:#ffffff; --head-fg:#111111;
  --ok:#5fcf98; --ok-soft:#163327; --warn:#f0b75e; --warn-soft:#3a2c12; --bad:#f08a82; --bad-soft:#3d1c1a; --info-soft:#1b2a3d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-fg);border-bottom:3px solid var(--brand)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.2px}
.logo .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:16px}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.8}
.top .spacer{flex:1}
.who{display:flex;gap:8px;align-items:center;font-size:13px}
.who select{background:#fff;color:#111;border:1px solid #c9d3e3;border-radius:6px;padding:5px 8px;font:inherit;color-scheme:light}
.logo img{height:34px;width:auto;display:block}
.logo .sub{font-family:var(--f-body);font-weight:500;font-size:13px;color:#4a5566;border-left:1px solid #d5dbe5;padding-left:12px}
.who select option{color:#17212e}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
main .wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:16px;margin:0 0 10px;text-wrap:balance}
p.lead{margin:4px 0 0;color:var(--muted);max-width:70ch}
.demo{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .n{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.grid2>*{min-width:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--info-soft);padding:8px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-Aberta{background:var(--bad-soft);color:var(--bad)}
.p-Justificada{background:var(--info-soft);color:var(--brand)}
.p-Aprovada{background:var(--ok-soft);color:var(--ok)}
.p-AprovadaPend{background:var(--warn-soft);color:var(--warn)}
.p-Ressalvada{background:var(--accent-soft);color:var(--brand)}
.card-p.s-Ressalvada{border-left-color:var(--brand)}
.p-Materialidade{background:var(--ok-soft,#e6f4ea);color:var(--ok)}
.card-p.s-Materialidade{border-left-color:var(--ok)}
.tic{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:transparent;font-weight:700;cursor:pointer;line-height:1}
.tic:hover{border-color:var(--ok);color:var(--ok)}
.tic.on{background:var(--ok);border-color:var(--ok);color:#fff}
tr.visto td:not(:first-child){opacity:.6}
.rec-aviso{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-weight:600}
.rep-aviso{background:var(--bad-soft,#fde8e8);color:var(--bad,#b3261e);border-radius:6px;padding:8px 10px;font-weight:600}
.resbox{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn.res{border-color:var(--brand);color:var(--brand)}
.p-Reprovada{background:var(--bad);color:#fff}
.rec{background:var(--accent);color:#fff}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.sev-Alta{background:var(--bad)}.sev-Média{background:var(--warn)}.sev-Baixa{background:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select,textarea{font:14px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{width:100%;min-height:58px;resize:vertical}
button.btn{font:500 13px var(--f-body);border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:var(--brand-fg)}
button.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
button.btn.sm{padding:4px 9px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.card-p{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.card-p.s-Justificada{border-left-color:var(--brand)}.card-p.s-Aprovada{border-left-color:var(--ok)}.card-p.s-AprovadaPend{border-left-color:var(--warn)}
.card-p .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-p .hd b{font-size:14px}
.hist{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;z-index:20}
.list{display:flex;flex-direction:column;gap:10px}
.partic{background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:13px}
.partic-form{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
.opts{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.opts label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.p-Desconsiderada{background:var(--info-soft);color:var(--muted)}
.card-p.s-Desconsiderada{border-left-color:var(--line);opacity:.85}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--brand);color:#fff;font:700 10px/1 var(--f-body);cursor:help;vertical-align:middle;margin-left:3px;text-transform:none;letter-spacing:0}
.tip{position:fixed;z-index:50;background:var(--fg);color:var(--bg);font:400 12.5px/1.45 var(--f-body);padding:8px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:none;text-transform:none;letter-spacing:0}
.pct{font-weight:600;padding:2px 8px;border-radius:99px}
.pct-ok{color:#fff;background:var(--brand)} .pct-bad{color:#fff;background:var(--bad)}
.pdfbtn{font:600 11px var(--f-body);color:var(--brand);background:var(--accent-soft);border:1px solid var(--brand);border-radius:5px;padding:1px 6px;cursor:pointer;margin-left:4px;vertical-align:middle}
.pdfadd{color:var(--muted);border-style:dashed;background:transparent}
.pdfbtn:hover{background:var(--brand);color:#fff}
.pdfv{position:fixed;inset:0;z-index:40;background:rgba(10,20,35,.55);display:flex;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.pdfv-box{background:var(--surface);border-radius:10px;flex:1;display:flex;flex-direction:column;min-width:0;max-width:1180px;margin:0 auto;overflow:hidden}
.pdfv-h{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pdfv-h .spacer{flex:1}
.pdfv-p{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--bg)}
.pdfv-p canvas{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:100%}
.nova{border-color:var(--brand)}
.contas{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-top:6px;background:var(--surface)}
.conta-op{display:grid;grid-template-columns:150px 1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;font:13px var(--f-body);color:var(--fg);cursor:pointer}
.conta-op:hover{background:var(--accent-soft)} .conta-op.sel{background:var(--brand);color:#fff}
@media (max-width:520px){.conta-op{grid-template-columns:1fr auto}.conta-op .mono:first-child{grid-column:1/-1}} .chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
button.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer}
.kpi.click:hover,.kpi.click:focus-visible{border-color:var(--brand);box-shadow:0 2px 10px rgba(1,98,231,.12)}
.kpi .go{font-size:12px;color:var(--brand);margin-top:4px}
tr.click{cursor:pointer} tr.click:hover>td{background:var(--accent-soft)} tr.open>td{background:var(--accent-soft);font-weight:500}
.car{display:inline-block;width:12px;color:var(--brand)}
tr.sub>td{padding:0 0 0 22px;background:var(--bg)}
.comp{padding:10px 10px 12px 0;display:flex;flex-direction:column;gap:8px}
.comp-h{font-size:13px}
.chip{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin:1px 0}
.barw{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{height:8px;border-radius:4px;background:var(--brand);opacity:.75;max-width:calc(100% - 30px)}
td a{color:var(--brand)}
.linkbox{font-family:var(--f-mono);font-size:12px;background:var(--info-soft);padding:6px 8px;border-radius:6px;word-break:break-all}
@media (prefers-reduced-motion:no-preference){.card-p{transition:border-color .2s}}
.sync{font-size:12px;color:var(--muted);margin-right:10px}.sync.err{color:var(--bad);font-weight:600}
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
</style>

const RX_NUM=/^\(?-?[\d.]*\d,\d{2}\)?[DC]?$/;
function numBR(s){
  let t=s.trim(), sg=1;
  if(/C$/.test(t)){sg=-1;t=t.slice(0,-1)} else if(/D$/.test(t)) t=t.slice(0,-1);
  if(/^\(.*\)$/.test(t)){sg=-sg;t=t.slice(1,-1)}

  return sg*parseFloat(t.replace(/\./g,'').replace(',','.'));
}
async function pdfParaLinhas(buf){
  const doc=await pdfjsLib.getDocument({data:buf}).promise; const linhas=[]; let texto='';
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i); const tc=await pg.getTextContent(); const by=new Map();
    for(const it of tc.items){
      const s=it.str.replace(/\s+$/,''); if(!s.trim()) continue;
      const x=it.transform[4], y=Math.round(it.transform[5]*2)/2, w=it.width;
      // separa "- 1.234,56" e itens com vários números
      const parts=s.trim().split(/\s{2,}|(?<=^-)\s+(?=\d)/); let off=0; const tot=s.length||1;
      for(const p of parts){const idx=s.indexOf(p,off); off=idx+p.length;
        const tk={s:p,x:x+w*idx/tot,x1:x+w*(idx+p.length)/tot,y};
        (by.get(y)||by.set(y,[]).get(y)).push(tk);}
      texto+=s+'\n';
    }
    [...by.keys()].sort((a,b)=>b-a).forEach(y=>linhas.push({pg:i,y,t:by.get(y).sort((a,b)=>a.x-b.x)}));
  }
  return {linhas,texto};
}
function detectarFormato(texto){
  if(/Cta\.cont/i.test(texto)) return 'SAP B1';
  if(/filiais SAP|Extenso/i.test(texto)) return 'SAP B1 (gerencial)';
  if(/Classifica/i.test(texto)&&/Descri..o da conta/i.test(texto)) return 'Domínio';
  return 'Desconhecido';
}
function lerMeta(texto,nomeArq,linhas){
  const m={};
  const le=(linhas||[]).slice(0,15).find(l=>l.t.some(t=>/^(Empresa:|ENTIDADE:)/i.test(t.s)));
  if(le){const i=le.t.findIndex(t=>/^(Empresa:|ENTIDADE:)/i.test(t.s)); const lab=le.t[i]; m.empresa=le.t.filter(t=>t!==lab&&t.x>lab.x&&t.x<lab.x+350&&!/^(Folha|LIVRO)/i.test(t.s)).map(t=>t.s.replace(/^(Empresa:|ENTIDADE:)\s*/i,'')).join(' ').trim()||undefined;}
  const cn=texto.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/); if(cn) m.cnpj=cn[0];
  const per=texto.match(/(\d{2})\/(\d{2})\/(\d{4})\s*(?:-|a)\s*(\d{2})\/(\d{2})\/(\d{4})/); if(per) m.mes=per[6]+'-'+per[5];
  const cod=(nomeArq||'').match(/^(\d{3,6})[_\- ]/); if(cod) m.cod=cod[1];
  if(!m.mes){const mm=(nomeArq||'').match(/(\d{2})[_\-]?(\d{4})/); if(mm) m.mes=mm[2]+'-'+mm[1];}
  return m;
}
function interpretarBalancete({linhas,texto},nomeArq){
  const formato=detectarFormato(texto), meta=lerMeta(texto,nomeArq,linhas);
  // corta o resumo final (Domínio)
  let fim=linhas.findIndex(l=>l.t.some(t=>/RESUMO DO BALANCETE/i.test(t.s))); if(fim<0) fim=linhas.length;
  const L=linhas.slice(0,fim);
  // colunas numéricas: agrupa bordas direitas dos números (alinhados à direita)
  const xs=[]; L.forEach(l=>l.t.forEach(t=>{if(RX_NUM.test(t.s)) xs.push(t.x1)})); xs.sort((a,b)=>a-b);
  const cl=[]; xs.forEach(x=>{const c=cl.at(-1); if(c&&x-c.max<8){c.max=x;c.n++;c.sum+=x} else cl.push({min:x,max:x,n:1,sum:x})});
  const top=Math.max(...cl.map(c=>c.n)); let cols=cl.filter(c=>c.n>=Math.max(3,top*0.15)).map(c=>c.sum/c.n);
  const nomes=cols.length>=5?['si','d','c','mes','sf']:['si','d','c','sf'];
  if(cols.length>5) cols=cols.slice(-5); if(cols.length<4) throw new Error('Não encontrei as 4 colunas de saldo anterior, débito, crédito e saldo atual.');
  const xNum0=cols[0]-90;

  const isCode=s=>/^\d[\d.]*\d$|^\d$/.test(s);
  for(const l of L){
    const tk=l.t; const nums={}; let neg=false, temNum=false; const txt=[]; const codes=[];
    for(const t of tk){
      if(t.s==='-'&&t.x>xNum0){neg=true;continue}
      if(RX_NUM.test(t.s)&&t.x1>xNum0){
        let best=-1,bd=1e9; cols.forEach((c,i)=>{const d=Math.abs(c-t.x1); if(d<bd){bd=d;best=i}});

      if(t.x<xNum0||!temNum) txt.push(t.s);
    }
    const desc=txt.join(' ').replace(/\s+/g,' ').trim();

    if(!codes.length&&temNum&&pend&&(!desc||desc==='-')){

    pend=null;

  }
  function mk(codes,desc,n){

    const r={conta,reduz:codes.length>1?codes[0]:'',desc,si:n.si||0,d:Math.abs(n.d||0),c:Math.abs(n.c||0),sf:n.sf||0,ctx:heads.slice(-1).join(' | ')};
    return r;
  }
  // só contas analíticas
  const codesAll=rows.map(r=>r.conta);
  const anal=rows.filter(r=>!codesAll.some(c=>c!==r.conta&&c.startsWith(r.conta)&&(c.length>r.conta.length)));
  const sint=rows.filter(r=>!anal.includes(r));
  anal.forEach(r=>{const anc=sint.filter(x=>r.conta.startsWith(x.conta)).sort((a,b)=>b.conta.length-a.conta.length).slice(0,3).map(x=>x.desc);
    if(anc.length) r.ctx=anc.join(' | '); if(!r.desc&&anc.length) r.desc=anc[0];});
  anal.forEach(r=>{r.sf=+r.sf.toFixed(2);r.si=+r.si.toFixed(2)});
  const totSf=anal.reduce((a,r)=>a+r.sf,0), totSi=anal.reduce((a,r)=>a+r.si,0);
  const conf=anal.filter(r=>Math.abs(r.si+r.d-r.c-r.sf)>0.02);
  return {formato,meta,rows:anal,sinteticas:rows.length-anal.length,checagem:{totSf:+totSf.toFixed(2),totSi:+totSi.toFixed(2),linhasQueNaoFecham:conf.length,exemplos:conf.slice(0,5)}};
}

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
const dig=r=>r.conta.replace(/\D/g,'')[0];
const T=r=>' '+norm(r.desc)+' ';            // só a descrição
const TC=r=>' '+norm(r.desc+' | '+(r.ctx||''))+' '; // descrição + grupos acima
function natureza(r){ // D = devedora, C = credora
  const g=dig(r), t=T(r);
  if(g==='1') return (/\(-\)|deprec|amortiz|exaust|pcld|devedores duvid|cred\. liquid|desagio/.test(t)||/\(-\)|deprec|amortiz|exaust|pcld|devedores duvid/.test(' '+norm((r.ctx||'').split('|')[0])))?'C':'D';
  if(g==='2'){ if(/\(-\)|prejuizo|distribuicao de lucro|lucros distribuidos|antecipacao de lucro|acoes em tesouraria|a integralizar/.test(t)) return 'D'; return 'C'; }
  if(/recupera/.test(t)) return 'C';
  if(/\(-\)|custo|despesa|comiss|frete|devoluc|cancelamento/.test(t)) return 'D';
  if(/receita|rendimento|dividendo|obtido|juros (ativos|recebidos)|variacao cambial ativa/.test(t)||/^ (vendas?|faturamento|prestacao de servic)/.test(t)) return 'C';
  return 'D';
}
function grupo(r){
  const g=dig(r), t=T(r), tc=TC(r);
  if(/transitori|a classificar|a identificar|a regularizar/.test(t)) return 'transit';
  if(g==='1'&&/adiant.*fornec/.test(tc)) return 'adFor';
  if(g==='2'&&/adiant.*client/.test(tc)) return 'adCli';
  if(/mutuo/.test(t)) return /juros|\bir\b|irrf|iof/.test(t)?'irMutuo':'mutuo';
  if(g==='1'&&/deprec|amortiz|exaust/.test(tc)) return 'deprec';
  if(g==='1'&&/imobilizad|intangivel/.test(tc)) return 'imob';
  if(g==='1'&&/recuperar|compensar/.test(tc)) return 'recup';
  if(g==='2'&&/(inss|fgts|encargo|pis)[^|]*ferias/.test(t)) return 'encFer';
  if(g==='2'&&/(inss|fgts|encargo|pis)[^|]*(13|decimo)/.test(t)) return 'enc13';
  if(g==='2'&&/ferias/.test(t)) return 'provFer';
  if(g==='2'&&/\b13|decimo/.test(t)) return 'prov13';
  if(g==='2'&&/salario|ordenado|pro-labore|pro labore|rescis/.test(t)&&!/irrf|\bir\b|inss|fgts|contribuic|sindical|pensao/.test(t)) return 'folha';
  if(g==='2'&&/parcelamento/.test(t)&&!/\(-\)/.test(t)) return 'parc';
  if(g==='2'&&!/\(-\)/.test(t)&&/recolher|fiscais|tributar|sociais|impost|\b(pis|cofins|icms|iss|ipi|irpj|csll|irrf|irf|inss|fgts|simples|das)\b|retenc|retido/.test(tc)) return 'impRec';
  if(g==='2'&&/fornecedor/.test(tc)) return 'forn';
  if(g==='1'&&/client|duplicatas a receber|contas a receber/.test(tc)&&!/adiant/.test(t)) return 'cli';
  if(g==='1'&&/estoque|mercadoria|produtos acabados|materia.prima/.test(tc)) return 'estoque';
  if(g!=='1'&&g!=='2'&&!/\(-\)/.test(t)&&/receita bruta|vendas? de|venda de|faturamento|receita de servic|prestacao de servic/.test(tc)) return 'receita';
  if(g!=='1'&&g!=='2'&&/compras|\bcmv\b|custo das mercad|custo dos produtos/.test(tc)) return 'compras';
  return null;
}
function auditar(St,cod,mes){

  const parts=cli.partic||[];
  const add=(premissa,r,descr)=>{if(off.includes(premissa))return; const conta=r?r.conta:'—';
    const pt=parts.filter(x=>x.premissa===premissa&&(x.conta===conta||x.conta==='*')&&x.escopo!=='mes').at(-1);

    if(r.g==='adFor'&&r.si>0.005&&r.c+0.005<r.si) add('P03',r,r.c<0.005?'Adiantamento a fornecedor do mês anterior sem nenhuma baixa no mês':`Baixa parcial: saldo anterior ${fmt(r.si)}, baixado ${fmt(r.c)}`);

    if(r.g==='folha'&&r.si<-0.005&&r.d+0.005<-r.si) add('S07',r,`Folha/pró-labore do mês anterior (${fmt(-r.si)}) sem baixa completa`);
    if(r.g==='transit'&&!z(r.sf)) add('S03',r,`Conta transitória com saldo de ${dc(r.sf)}`);
    if((r.g==='forn'||r.g==='cli')&&!z(r.sf)&&z(r.d)&&z(r.c)) add('S15',r,`Saldo de ${dc(r.sf)} sem movimentação no mês`);

}

const useCap=n=>(window.claude&&claude.use?claude.use(n):Promise.resolve(null)).catch(()=>null);

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('confirp-pdfs',1);r.onupgradeneeded=()=>r.result.createObjectStore('pdf');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,blob){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('pdf','readwrite');t.objectStore('pdf').put(blob,k);t.oncomplete=res;t.onerror=()=>rej(t.error)});return true}catch(e){return false}}
async function idbGet(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('pdf').objectStore('pdf').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}

async function abrirPdf(k,mapa='pdf'){
  const m=S[mapa][k], [cod,mes]=k.split('|'), c=S.clientes.find(c=>c.cod===cod)||{};
  const box=$('#pdfv'); box.hidden=false; $('#pdfv-t').textContent=`${mapa==='ress'?'Ressalva · ':mapa==='limArq'?'Formalização da limitação de escopo · ':''}${cod} · ${c.nome||''} · ${mesTxt(mes)}`; const pg=$('#pdfv-p'); pg.innerHTML='<p class="muted">Abrindo o balancete…</p>';
  $('#pdfv-d').hidden=false;
  $('#pdfv-r').hidden=mapa==='limArq'; const ri=$('#pdfv-ri'); ri.value=''; delete ri.dataset.addpdf; delete ri.dataset.addres; ri.dataset[mapa==='ress'?'addres':'addpdf']=k; ri.accept=mapa==='ress'?'.pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx,.msg,.eml':'.pdf'; $('#pdfv-r').firstChild.textContent=mapa==='ress'?'Trocar ressalva':'Trocar PDF';
  const data=await obterPdf(k,mapa);
  if(!data){pg.innerHTML='<p class="muted">Não consegui abrir este arquivo aqui. Ele foi guardado em outro navegador ou computador. Suba o arquivo de novo para ele ficar disponível.</p>';return}
  $('#pdfv-d').onclick=()=>baixarBytes(data,m.nome||`${cod}_${mes}.pdf`);
  const ext=(m.nome||'').toLowerCase().split('.').pop();
  if(['png','jpg','jpeg'].includes(ext)){const u=URL.createObjectURL(new Blob([data],{type:'image/'+(ext==='png'?'png':'jpeg')}));pg.innerHTML=`<img src="${u}" alt="Ressalva" style="max-width:100%">`;return}
  if(ext!=='pdf'){pg.innerHTML=`<p class="muted">O arquivo ${esc(m.nome)} não abre aqui na tela. Use "Baixar" para abrir no seu computador.</p>`;return}
  try{const doc=await pdfjsLib.getDocument({data:data.slice()}).promise; pg.innerHTML='';
    const w=Math.min(pg.clientWidth-8,1100);
    for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const v0=page.getViewport({scale:1});const sc=w/v0.width;const vp=page.getViewport({scale:sc*(devicePixelRatio||1)});
      const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;cv.style.width=(vp.width/(devicePixelRatio||1))+'px';pg.appendChild(cv);
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; if($('#pdfv').hidden) break;}
  }catch(e){pg.innerHTML='<p class="muted">Não consegui ler este PDF.</p>'}
}

  <div class="drop" id="drop" style="margin-top:14px">Arraste os balancetes aqui ou <label style="color:var(--accent);cursor:pointer;text-decoration:underline">escolha os arquivos<input type="file" id="u-file" accept=".pdf,.xlsx,.xls,.csv" multiple hidden></label></div>
  <div id="u-prev" style="margin-top:14px"></div></div>`;
  const drop=$('#drop');
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
  drop.addEventListener('drop',e=>lerArquivos([...e.dataTransfer.files]));
  $('#u-file').onchange=e=>lerArquivos([...e.target.files]);
  if(lote.length) prevLote();
}
function num(v){
  if(typeof v==='number') return v; if(v==null) return 0; let s=String(v).trim(); if(!s) return 0;
  let sign=1; if(/c$/i.test(s)){sign=-1;s=s.slice(0,-1)} else if(/d$/i.test(s)){s=s.slice(0,-1)}
  if(/^\(.*\)$/.test(s)){sign=-sign;s=s.slice(1,-1)}
  s=s.replace(/[^\d,.\-]/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n*sign;
}
function lerExcel(buf,nome){
  const wb=XLSX.read(buf,{type:'array'}); const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  const hi=aoa.findIndex(r=>r.some(c=>/conta|classif/i.test(c))&&r.some(c=>/saldo/i.test(c)));
  if(hi<0) throw new Error('Não achei a linha de cabeçalho com "Conta" e "Saldo".');
  const H=aoa[hi].map(h=>norm(String(h))); const find=re=>H.findIndex(h=>re.test(h));
  const ix={conta:find(/classif|^conta$|codigo/),desc:find(/descri|nome/),si:find(/anterior|inicial/),d:find(/debito/),c:find(/credito/),sf:find(/atual|final/)};
  if(ix.conta<0||ix.sf<0) throw new Error('Não achei as colunas de conta e saldo atual.');
  const rows=aoa.slice(hi+1).filter(r=>String(r[ix.conta]).trim()).map(r=>({conta:String(r[ix.conta]).trim(),desc:String(ix.desc>=0?r[ix.desc]:'').trim(),si:num(r[ix.si]),d:Math.abs(num(r[ix.d])),c:Math.abs(num(r[ix.c])),sf:num(r[ix.sf])}));
  const codes=rows.map(r=>r.conta); const anal=rows.filter(r=>!codes.some(c=>c!==r.conta&&c.startsWith(r.conta)));
  const tot=anal.reduce((a,r)=>a+r.sf,0);
  return {formato:'Excel',meta:lerMeta('',nome),rows:anal,checagem:{totSf:+tot.toFixed(2)}};
}
async function lerArquivos(files){
  $('#u-prev').innerHTML='<p class="muted">Lendo arquivos…</p>';
  for(const f of files){
    const buf=await f.arrayBuffer(); let r;
    try{ r=/\.pdf$/i.test(f.name)?interpretarBalancete(await pdfParaLinhas(buf),f.name):lerExcel(buf,f.name); }
    catch(e){ r={erro:e.message}; }
    const cli=r.meta&&S.clientes.find(c=>c.cod===r.meta.cod);
    lote.push({arq:f.name,file:f,...r,cod:(r.meta||{}).cod||'',mes:(r.meta||{}).mes||'',nome:cli?cli.nome:((r.meta||{}).empresa||''),novo:!cli});
  }
  prevLote();
}

function importarCarteira(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true}); const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  const hi=aoa.findIndex(r=>r.some(c=>/^cod/i.test(String(c)))&&r.some(c=>/raz/i.test(String(c))));
  if(hi<0) throw new Error('Não achei o cabeçalho com Cod e Razão Social');
  const vistos={}; let n=0;
  aoa.slice(hi+1).forEach(r=>{
    const cod=String(r[0]).trim(); if(!/^\d+$/.test(cod)) return;
    const A=String(r[10]||'').trim()!=='';
    const d=A?{nome:r[1],grupo:r[2],trib:r[5],analista:r[8]||r[6],coord:r[9]||r[7],exec:r[10],status:r[11]}:{nome:r[1],grupo:r[2],trib:r[5],analista:r[6],coord:r[7],exec:r[8],status:''};
    if(vistos[cod]&&!A) return; vistos[cod]=1;
    const exNome=String(d.exec||'').trim()||'Sem executivo';
    let ex=S.execs.find(e=>norm(e.nome)===norm(exNome)); if(!ex){ex={id:uid(),nome:exNome,token:novoToken()};S.execs.push(ex)}
    let c=S.clientes.find(c=>c.cod===cod); if(!c){c={cod,pmp:60,pmr:45,obs:'',off:[],partic:[],sistema:''};S.clientes.push(c);n++}
    Object.assign(c,{nome:String(d.nome).trim(),grupo:String(d.grupo||'').trim(),trib:String(d.trib||'').trim(),analista:String(d.analista||'').trim(),coord:String(d.coord||'').trim(),exec:ex.id});
    if(d.status) c.statusAnt=String(d.status).trim();
    S.pend.filter(p=>p.cod===cod).forEach(p=>p.exec=ex.id);
  });
  return n;
}

function linhasDeS(){
  const L=new Map(); const put=(tipo,chave,exec,valor)=>L.set(tipo+SEP+chave,{tipo,chave,exec,valor});
  if(MODO==='admin'){S.execs.forEach(e=>put('exec',e.id,e.id,e)); (S.treino||[]).forEach(t=>put('treino',t.id,null,t));}
  S.clientes.forEach(c=>put('cli',c.cod,c.exec,c));
  S.pend.forEach(p=>put('pend',p.id,p.exec,p));
  MAPAS.forEach(m=>Object.entries(S[m]||{}).forEach(([k,v])=>put(m,k,execDeCod(k.split('|')[0]),v)));
  Object.entries(S.balancetes).forEach(([cod,ms])=>Object.entries(ms).forEach(([mes,rows])=>{if(rows) put('bal',cod+'|'+mes,execDeCod(cod),rows)}));
  if(MODO==='exec') for(const [k,r] of L) if(!TIPOS_EXEC.includes(r.tipo)) L.delete(k);
  return L;
}

  finally{sincronizando=false; if(pendenteSync){pendenteSync=false;agendarSync()}}
}
addEventListener('beforeunload',e=>{if(tSync||sincronizando){e.preventDefault();e.returnValue=''}});

// ----- carregar -----
async function paginar(q){let out=[];for(let i=0;;i+=1000){const {data,error}=await q().range(i,i+999); if(error) throw error; out=out.concat(data||[]); if(!data||data.length<1000) break} return out}
function montarS(rows,balKeys){
  const N={execs:[],clientes:[],balancetes:{},pend:[],treino:[]}; snap=new Map();
  for(const r of rows){
    if(r.tipo==='bal'){const [cod,mes]=r.chave.split('|');(N.balancetes[cod]=N.balancetes[cod]||{})[mes]=null;continue}
    snap.set(r.tipo+SEP+r.chave,sig(r.exec,r.valor));
    if(r.tipo==='exec') N.execs.push(r.valor); else if(r.tipo==='cli') N.clientes.push(r.valor); else if(r.tipo==='pend') N.pend.push(r.valor);
    else if(r.tipo==='treino') N.treino.push(r.valor); else if(MAPAS.includes(r.tipo)) (N[r.tipo]=N[r.tipo]||{})[r.chave]=r.valor;
  }
  (balKeys||[]).forEach(k=>{const [cod,mes]=k.split('|');(N.balancetes[cod]=N.balancetes[cod]||{})[mes]=null});
  N.treino.sort((a,b)=>(a.data||'')<(b.data||'')?-1:1);
  S=N; ultimaCarga=Date.now();
}
async function carregar(){
  if(MODO==='exec'){const rows=await paginar(()=>sb.rpc('ex_ler',{t:TOKEN})); montarS(rows,[]); const e=S.execs[0]; if(!e) throw new Error('link_invalido'); perfil=e.id;}
  else{const rows=await paginar(()=>sb.from('itens').select('tipo,chave,exec,valor').neq('tipo','bal').order('tipo').order('chave'));
    const bk=await paginar(()=>sb.from('itens').select('chave').eq('tipo','bal').order('chave')); montarS(rows,bk.map(r=>r.chave));}
}
async function garantirBal(cod){
  const ms=S.balancetes[cod]; if(!ms) return; const ks=Object.keys(ms).filter(m=>ms[m]===null).map(m=>cod+'|'+m); if(!ks.length) return;
  const {data,error}=MODO==='exec'?await sb.rpc('ex_bal',{t:TOKEN,chaves:ks}):await sb.from('itens').select('chave,valor').eq('tipo','bal').in('chave',ks);
  if(error) throw error;
  (data||[]).forEach(r=>{const mes=r.chave.split('|')[1]; ms[mes]=r.valor; snap.set('bal'+SEP+r.chave,sig(execDeCod(cod),r.valor))});
}

// ----- troca de executivo de um cliente: leva balancetes e arquivos -----
async function aoTrocarExec(cod,ex){
  if(MODO!=='admin') return;
  await garantirBal(cod);
  const aids=['pdf','ress','limArq'].map(m=>(S[m]||{})).flatMap(o=>Object.entries(o).filter(([k])=>k.split('|')[0]===cod).map(([,v])=>v.aid)).filter(Boolean);
  if(aids.length){const {error}=await sb.from('arquivos').update({exec:ex}).in('id',aids); if(error) throw error}
}

// ----- arquivos -----
async function guardarArqNuvem(cod,mes,file,mapa){
  const k=cod+'|'+mes; S[mapa]=S[mapa]||{};
  if(file.size>15*1024*1024){toast('O arquivo passa de 15 MB');return}
  const b64=await paraB64(file);
  const {data,error}=MODO==='exec'?await sb.rpc('ex_salvar_arq',{t:TOKEN,nome:file.name,b64}):await sb.rpc('adm_salvar_arq',{nome:file.name,b64,dono:execDeCod(cod)});
  if(error){toast('Não consegui guardar o arquivo: '+msgErro(error));return}
  S[mapa][k]={aid:data,nome:file.name};
}
async function lerArqNuvem(k,mapa){
  const m=(S[mapa]||{})[k]; if(!m||!m.aid) return null;
  const {data,error}=MODO==='exec'?await sb.rpc('ex_ler_arq',{t:TOKEN,aid:m.aid}):await sb.rpc('adm_ler_arq',{aid:m.aid});
  if(error||!data||!data.length) return null; return b64ParaBytes(data[0].b64);
}

// ----- importar backup do protótipo -----
async function importarBackup(f){
  const st=$('#bk-st'); let j;
  try{j=JSON.parse(await f.text())}catch(e){st.textContent='Arquivo inválido.';return}
  if(!j||j.app!=='auditoria-confirp'||!j.S){st.textContent='Este arquivo não é um backup do portal.';return}
  const N=j.S; N.execs=N.execs||[]; N.clientes=N.clientes||[]; N.balancetes=N.balancetes||{}; N.pend=N.pend||[]; N.treino=N.treino||[];
  N.execs.forEach(e=>{if(!e.token||e.token.length<16) e.token=novoToken()});
  const exDe=cod=>{const c=N.clientes.find(c=>c.cod===cod);return c?c.exec:null};
  const arqs=Object.entries(j.arquivos||{}); let i=0, falhas=0;
  for(const m of ['pdf','ress','limArq']){const o=N[m]||{}; for(const k of Object.keys(o)) if(!(j.arquivos||{})[m+'|'+k]) delete o[k]}
  for(const [key,a] of arqs){i++; st.textContent=`Enviando arquivos ${i} de ${arqs.length}…`;
    const [m,cod,mes]=key.split('|'); const {data,error}=await sb.rpc('adm_salvar_arq',{nome:a.nome,b64:a.b64,dono:exDe(cod)});
    if(error){falhas++;delete (N[m]||{})[cod+'|'+mes];continue} (N[m]=N[m]||{})[cod+'|'+mes]={aid:data,nome:a.nome}}
  st.textContent='Gravando os dados…';
  S=N; snap.forEach((v,k)=>{if(k.startsWith('bal'+SEP)) snap.delete(k)});
  await sincronizar();
  st.textContent=`Backup importado: ${N.clientes.length} clientes, ${N.pend.length} pendências, ${arqs.length-falhas} arquivos.`+(falhas?` ${falhas} arquivos falharam.`:'');
  renderPerfil(); render();
}

// ----- entrada -----
function telaLogin(msg){
  $('#tabs').innerHTML=''; document.querySelector('.who').hidden=true; $('#sair').hidden=true;
  $('#view').innerHTML=`<form class="login panel" id="lg"><h1>Entrar</h1><p class="muted" style="margin:0">Acesso do auditor. Executivos entram pelo link próprio.</p>
   <div class="field"><label for="lg-e">E-mail</label><input id="lg-e" type="email" autocomplete="username" required></div>
   <div class="field"><label for="lg-s">Senha</label><input id="lg-s" type="password" autocomplete="current-password" required></div>
   <button class="btn" type="submit">Entrar</button><p class="muted" id="lg-m" style="margin:0;color:var(--bad)">${esc(msg||'')}</p></form>`;
  $('#lg').onsubmit=async ev=>{ev.preventDefault(); $('#lg-m').textContent='Entrando…';
    const {error}=await sb.auth.signInWithPassword({email:$('#lg-e').value.trim(),password:$('#lg-s').value});
    if(error){$('#lg-m').textContent='E-mail ou senha incorretos.';return} entrarAdmin()};
}
async function entrarAdmin(){
  const {data:ok,error}=await sb.rpc('is_admin'); if(error||!ok){await sb.auth.signOut(); return telaLogin('Este e-mail não está liberado como auditor.')}
  $('#view').innerHTML='<p class="muted">Carregando a auditoria…</p>';
  try{await carregar()}catch(e){$('#view').innerHTML=`<p class="muted">Não consegui carregar: ${esc(msgErro(e))}</p>`;return}
  document.querySelector('.who').hidden=false; $('#sair').hidden=false;
  $('#sair').onclick=async()=>{await sb.auth.signOut(); location.reload()};
  statusSync('Tudo salvo'); perfil='admin'; if(!['painel','upload','pend','resumo','clientes','treino','execs'].includes(tab)) tab='painel';
  renderPerfil(); render();
}
async function iniciar(){
  $('#view').innerHTML='<p class="muted">Carregando…</p>';
  if(MODO==='exec'){
    document.querySelector('.who').hidden=true;
    try{await carregar()}catch(e){$('#tabs').innerHTML='';$('#view').innerHTML=`<div class="panel"><h1>Link inválido</h1><p class="muted">${esc(msgErro(e))}</p></div>`;return}
    tab='meus'; statusSync('Tudo salvo'); render();
  }else{
    const {data}=await sb.auth.getSession(); if(data&&data.session) entrarAdmin(); else telaLogin();
  }
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible'||tSync||sincronizando||Date.now()-ultimaCarga<60000) return;
    if(MODO==='admin'){const {data}=await sb.auth.getSession(); if(!data||!data.session) return}
    try{await carregar(); render()}catch(e){}
  });
}

iniciar();
</script>
